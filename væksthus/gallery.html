{% extends 'layout.html' %}

{% block content %}
<div class="container">
    <div class="row">
        {% for row in image_rows %}
        <div class="col-md-4 mt-3 col-lg-3">

            <img src="{{ url_for('static', filename='img/' + row[0]) }}" class="img-fluid">

            <p>{{ row[0] }}</p>

        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
